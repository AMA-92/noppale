<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Définition du dégradé bleu clair -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle avec dégradé bleu clair -->
  <circle cx="256" cy="256" r="240" fill="url(#blueGradient)"/>
  
  <!-- Lettre N blanche exactement comme dans votre design -->
  <text x="256" y="335" font-family="Arial Black, sans-serif" font-size="180" font-weight="900" text-anchor="middle" fill="white">N</text>
  
  <!-- Optionnel: petit cercle intérieur pour effet -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
</svg>
