<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Définition du dégradé bleu clair -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle avec dégradé bleu clair -->
  <circle cx="96" cy="96" r="88" fill="url(#blueGradient)"/>
  
  <!-- Lettre N blanche exactement comme dans votre design -->
  <text x="96" y="125" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="white">N</text>
  
  <!-- Optionnel: petit cercle intérieur pour effet -->
  <circle cx="96" cy="96" r="84" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>
</svg>
