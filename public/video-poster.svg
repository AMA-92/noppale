<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé bleu -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGradient)"/>
  
  <!-- Logo Noppalé -->
  <circle cx="640" cy="280" r="80" fill="#3B82F6"/>
  <text x="640" y="320" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="white">N</text>
  
  <!-- Texte principal -->
  <text x="640" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="white">Noppalé</text>
  <text x="640" y="470" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#94a3b8">Gestion Commerciale Simplifiée</text>
  
  <!-- Icônes de fonctionnalités -->
  <g transform="translate(320, 520)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#3B82F6" opacity="0.8"/>
    <text x="60" y="45" font-family="Arial" font-size="32" text-anchor="middle" fill="white">📦</text>
    <text x="60" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Stocks</text>
  </g>
  
  <g transform="translate(480, 520)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#10b981" opacity="0.8"/>
    <text x="60" y="45" font-family="Arial" font-size="32" text-anchor="middle" fill="white">💰</text>
    <text x="60" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Ventes</text>
  </g>
  
  <g transform="translate(640, 520)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#f59e0b" opacity="0.8"/>
    <text x="60" y="45" font-family="Arial" font-size="32" text-anchor="middle" fill="white">👥</text>
    <text x="60" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Clients</text>
  </g>
  
  <g transform="translate(800, 520)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#ef4444" opacity="0.8"/>
    <text x="60" y="45" font-family="Arial" font-size="32" text-anchor="middle" fill="white">📊</text>
    <text x="60" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Stats</text>
  </g>
  
  <!-- Bouton play -->
  <circle cx="640" cy="360" r="40" fill="white" opacity="0.9"/>
  <polygon points="620,340 620,380 660,360" fill="#3B82F6"/>
</svg>
